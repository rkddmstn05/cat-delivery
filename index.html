<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6EC1F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="고양이 택배">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0;font-size:14px;-webkit-text-size-adjust:100%;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>고양이 골목 택배</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one phone-shaped column over a painted sky-and-grass backdrop; screens swap in place. Single committed daylight look. */
:root{
  --sky:#6EC1F2; --sky-pale:#CDEEFF; --grass:#93D46A; --grass-deep:#6FB84E;
  --ink:#1E3A57; --ink-soft:#3F5870; --orange:#E5671F; --orange-deep:#B44E14;
  --cream:#FFF6E3; --cream-deep:#F0CF95; --blue:#2B5FA8; --card:#FFFFFF; --card-soft:#EEF7FD;
  --gold:#FFC531; --gold-deep:#F2A91C; --hint:#FFC94A; --hint-deep:#D99A1E; --hint-ink:#5E3A00;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#bg,#bgHome{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#bgHome{display:none}
body.home #bgHome{display:block}
body.home #bg{display:none}
body.home{background:#93D46A}
#homeCat{width:min(250px,64vw);height:auto;flex:none;margin-top:8px;display:block}
#title .title-actions{position:relative;z-index:1;margin-top:-96px}
#title .btn-home{height:62px;border-radius:22px;background:var(--card);color:var(--blue);font-size:26px;box-shadow:0 6px 0 #C6DCEB,0 12px 20px rgba(40,90,40,.18)}
#app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 20px;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button{font-family:var(--display);border:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:active{transform:translateY(3px)}
button:disabled{opacity:.45;cursor:default;transform:none}
.btn-main{height:62px;border-radius:22px;background:var(--orange);color:#FFFFFF;font-size:26px;box-shadow:0 6px 0 var(--orange-deep),0 12px 20px rgba(120,60,20,.2)}
.btn-sub{height:52px;border-radius:22px;background:var(--card);color:var(--blue);font-size:20px;box-shadow:0 5px 0 #C6DCEB}
.round{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(60,120,170,.2);flex:none}
.pill{background:rgba(255,255,255,.88);border-radius:999px;display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:15px;box-shadow:0 3px 0 rgba(60,120,170,.15)}

/* title */
#title{align-items:center;gap:18px}
.toprow{width:100%;display:flex;justify-content:space-between;align-items:center}
.toprow-right{display:flex;align-items:center;gap:8px}
.sign{position:relative;margin-top:72px;width:min(100%,320px)}
.ears{position:absolute;left:0;top:-46px;width:100%;height:58px}
.sign-body{position:relative;background:#F7A845;border-radius:40px;padding:22px 16px 26px;text-align:center;box-shadow:inset 0 -16px 0 #EA902F,0 8px 0 #D07A22,0 18px 30px rgba(120,60,20,.22)}
.sign-body .stripes{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.sign-body small{display:block;margin-top:6px;font-family:var(--display);font-size:16px;color:#7A3E12}
.sign-body h1{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,38px);line-height:1.1;color:#5A2B0C;white-space:nowrap}
.blush{position:absolute;bottom:22px;width:30px;height:14px;border-radius:50%;background:#FF7E7E;opacity:.45}
.blush.l{left:16px}.blush.r{right:16px}
.next-info{margin:0;text-align:center;font-size:14px;color:#1F4A2A;background:rgba(255,255,255,.72);border-radius:14px;padding:8px 12px}
.music-btn .mute{display:none}.music-btn.off .mute{display:inline}
.edit-btn.on{background:var(--orange);box-shadow:0 4px 0 var(--orange-deep)}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.qbtn{flex:none;width:26px;height:26px;border-radius:50%;background:transparent;border:2px solid var(--blue);color:var(--blue);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box}
@keyframes qpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.9),0 2px 0 rgba(60,120,170,.25)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0),0 2px 0 rgba(60,120,170,.25)}}
@media (prefers-reduced-motion:reduce){.qbtn.pulse{animation:none}}
#town .hud{gap:6px}
#play .hud{gap:6px}
#play .hud .round{width:44px;height:44px}
.bar-right{display:flex;align-items:center;gap:12px}
#town .pill{font-size:13px;padding:6px 10px;white-space:nowrap}
.title-actions{width:100%;display:flex;flex-direction:column;gap:12px}

/* play */
#play{gap:12px}
.hud{display:flex;align-items:center;gap:10px}
.hud .name{flex:1;min-width:0;display:flex;flex-direction:column}
.cnt{font-family:var(--body)!important;font-size:13px!important;font-weight:700}
.hud .name > span:first-child{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .name b,.nm b{font-family:var(--display);font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:1px}
.bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.88);border-radius:18px;padding:8px 16px;box-shadow:0 4px 0 rgba(60,120,170,.15)}
.bar b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{touch-action:none;display:block;max-width:100%}
#tip{margin:0;text-align:center;font-size:14px;line-height:1.5;color:#1F4A2A;background:rgba(255,255,255,.72);border-radius:14px;padding:8px 12px;min-height:42px;display:flex;align-items:center;justify-content:center}
.controls{display:flex;gap:10px}
.controls button{flex:1;height:54px;border-radius:20px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:6px}
.c-undo{background:var(--card);color:var(--blue);box-shadow:0 5px 0 #B9D7A0}
.c-hint{background:var(--hint);color:var(--hint-ink);box-shadow:0 5px 0 var(--hint-deep)}

/* clear */
#intro{position:fixed;inset:0;z-index:6;background:rgba(30,90,150,.45);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#intro .card h2.intro-title{font-size:26px;text-align:center;text-wrap:balance}
#intro p{line-height:1.6}
#town{gap:12px}
#townWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#townMap{touch-action:none;display:block;max-width:100%}
.tipbox{margin:0;text-align:center;font-size:14px;line-height:1.5;color:#1F4A2A;background:rgba(255,255,255,.72);border-radius:14px;padding:8px 12px;min-height:42px;display:flex;align-items:center;justify-content:center}
.inv{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:96px}
.inv-item{flex:none;width:76px;height:88px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 #C6DCEB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--body);font-size:11px;color:var(--ink)}
.inv-item canvas{width:44px;height:44px}
.inv-item.sel{box-shadow:0 0 0 3px var(--orange),0 4px 0 #C6DCEB}
.inv-item.placed{opacity:.55}
.inv-empty{margin:auto;font-size:14px;color:var(--ink-soft)}
#clear{position:fixed;inset:0;z-index:5;background:rgba(30,90,150,.45);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:330px;background:var(--card);border-radius:30px;box-shadow:0 8px 0 #BFE2F5,0 20px 40px rgba(20,80,140,.25);padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}
.card .bigstars{display:flex;align-items:flex-end;gap:4px;margin-top:-64px}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:40px;color:#C9561A}
.card p{margin:0;font-size:15px;color:var(--ink-soft);text-align:center}
.reward{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--card-soft);border-radius:18px;padding:10px 14px}
.reward span{flex:1}
.reward b{font-family:var(--display);font-weight:400;font-size:21px;color:#24507A}
.card .acts{width:100%;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

</head>
<body>
<svg id="bg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC1F2"/><stop offset="1" stop-color="#CDEEFF"/></linearGradient>
    <filter id="g-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <filter id="g-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.2  0 0 0 0 0.3  0.22 0 0 0 -0.08"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#g-sky)"/>
  <g filter="url(#g-rough)">
    <g fill="#FFFFFF"><circle cx="320" cy="70" r="30"/><circle cx="360" cy="60" r="38"/><ellipse cx="350" cy="92" rx="70" ry="14"/></g>
    <g fill="#FFFFFF" opacity="0.9"><circle cx="30" cy="140" r="24"/><circle cx="66" cy="130" r="30"/><ellipse cx="54" cy="154" rx="60" ry="12"/></g>
    <g fill="#FFFFFF" opacity="0.8"><circle cx="210" cy="40" r="18"/><circle cx="236" cy="34" r="22"/><ellipse cx="226" cy="52" rx="44" ry="9"/></g>
    <path d="M-20 300 Q120 270 220 286 Q320 276 410 296 L410 844 L-20 844 Z" fill="#93D46A"/>
    <path d="M-20 400 Q80 380 160 400 L160 844 L-20 844 Z" fill="#84CC60" opacity="0.6"/>
    <path d="M240 640 Q320 620 410 640 L410 844 L240 844 Z" fill="#84CC60" opacity="0.6"/>
  </g>
  <rect width="390" height="844" filter="url(#g-grain)"/>
</svg>

<svg id="bgHome" viewBox="0 0 390 844" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DB8F0"/><stop offset="1" stop-color="#9ED8F8"/></linearGradient>
    <linearGradient id="h-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93D46A"/><stop offset="1" stop-color="#7CC45A"/></linearGradient>
    <filter id="h-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <filter id="h-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.25  0 0 0 0 0.1  0.2 0 0 0 -0.07"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#h-sky)"/>
  <g filter="url(#h-rough)">
    <g fill="#FFFFFF" opacity="0.85"><circle cx="330" cy="40" r="20"/><circle cx="356" cy="34" r="24"/><ellipse cx="346" cy="54" rx="46" ry="9"/></g>
    <path d="M-20 92 Q60 70 140 84 Q240 64 300 80 Q360 70 410 86 L410 844 L-20 844 Z" fill="url(#h-grass)"/>
    <path d="M-20 300 Q60 286 120 300 L120 844 L-20 844 Z" fill="#88CE62" opacity="0.5"/>
    <path d="M270 520 Q330 504 410 518 L410 844 L270 844 Z" fill="#88CE62" opacity="0.5"/>
  </g>
  <rect width="390" height="844" filter="url(#h-grain)"/>
</svg>

<div id="app">
  <section id="title" class="screen">
    <div class="toprow">
      <div class="pill" aria-label="생선 코인">
        <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20 Q16 8 28 20 Q16 32 5 20 Z" fill="#6FB2E6"/><path d="M27 20 L36 12 V28 Z" fill="#5598D0"/><circle cx="12" cy="18" r="2" fill="#2A3A4A"/></svg>
        <b id="coins">0</b>
      </div>
      <div class="toprow-right">
        <div class="pill">별 <b id="starTotal">0</b> / <span id="starMax">72</span></div>
        <button class="round music-btn" aria-pressed="true" aria-label="배경음악 끄기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="#3E6A92"/><circle cx="16.5" cy="16" r="2.5" fill="#3E6A92"/><path class="mute" d="M3 3l18 18" stroke="#E5533F"/></svg></button>
      </div>
    </div>
    <div class="sign">
      <svg class="ears" viewBox="0 0 320 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M34 60 Q30 6 58 2 Q78 2 112 54 Z" fill="#F7A845"/><path d="M48 56 Q48 22 60 16 Q72 18 92 52 Z" fill="#FFB9A8"/>
        <path d="M286 60 Q290 6 262 2 Q242 2 208 54 Z" fill="#F7A845"/><path d="M272 56 Q272 22 260 16 Q248 18 228 52 Z" fill="#FFB9A8"/>
      </svg>
      <div class="sign-body">
        <svg class="stripes" width="48" height="18" viewBox="0 0 48 18" aria-hidden="true"><path d="M12 2v10M24 2v13M36 2v10" stroke="#E07E22" stroke-width="5" stroke-linecap="round"/></svg>
        <small>한붓그리기 배달 퍼즐</small>
        <h1>고양이 골목 택배</h1>
        <span class="blush l" aria-hidden="true"></span><span class="blush r" aria-hidden="true"></span>
      </div>
    </div>
    <canvas id="homeCat" width="480" height="560" role="img" aria-label="배달 모자를 쓰고 가방을 멘 고양이"></canvas>
    <div class="title-actions">
      <p id="nextInfo" class="next-info" hidden></p>
      <button class="btn-main" id="startBtn">배달 시작</button>
      <button class="btn-home" id="townBtn">동네 골목 확인</button>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="hud">
      <button class="round" id="backBtn" aria-label="골목 선택으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="name"><span id="lvNo">골목 1</span><span class="nm"><b id="lvName">첫 배달</b><button class="qbtn" id="ruleBtn" aria-label="이 골목 규칙 보기">?</button></span></div>
      <button class="round" id="homeBtn" aria-label="홈으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      </button>
      <button class="round" id="resetBtn" aria-label="처음부터 다시">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
    <div class="bar">
      <span style="display:flex;align-items:center;gap:8px">
        <svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="#D9A066"/><rect x="2" y="4" width="20" height="6" rx="3" fill="#EBC08A"/><rect x="10.5" y="4" width="3" height="16" fill="#F7DDB0"/></svg>
        남은 칸</span>
      <span class="bar-right"><span class="stars" id="hudStars" role="img" aria-label="별"></span><b id="left">0</b></span>
    </div>
    <div id="boardWrap"><canvas id="board" aria-label="골목 지도. 고양이에서 시작해 손가락으로 길을 그려 모든 집에 배달하세요"></canvas></div>
    <p id="tip">모든 칸을 지나 깃발 집에 마지막으로 도착해요</p>
    <div class="controls">
      <button class="c-undo" id="undoBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
        한 칸 뒤로</button>
      <button class="c-hint" id="hintBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg>
        <span id="hintLabel">힌트</span></button>
    </div>
  </section>

  <section id="town" class="screen" hidden>
    <div class="hud">
      <button class="round" id="townBack" aria-label="홈으로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      </button>
      <div class="name"><span><span id="townMode">골목 고르기</span> · 불 켜진 집 <b class="cnt" id="townLit">0</b>/<span id="townLitMax">24</span></span><b>우리 동네</b></div>
      
      <button class="round music-btn" aria-pressed="true" aria-label="배경음악 끄기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="#3E6A92"/><circle cx="16.5" cy="16" r="2.5" fill="#3E6A92"/><path class="mute" d="M3 3l18 18" stroke="#E5533F"/></svg></button>
      <button class="round edit-btn" id="editBtn" aria-pressed="false" aria-label="동네 꾸미기">
        <svg id="editIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E6A92" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
        <svg id="doneIcon" hidden width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>

<script>
/*CORE*/
// Each neighborhood adds one delivery rule on top of the ones before it, and its four alleys grow 4x4 -> 7x7 (5x5 -> 8x8 from the third neighborhood on).
// Levels are generated from a fixed seed by walking the answer path first, so every level is solvable.
const CHAPTERS = [
  { name: '아랫마을', rule: 'basic', levels: ['첫 배달', '우유가게 앞', '빨래터 길', '아랫마을 광장'] },
  { name: '시장 골목', rule: 'order', levels: ['생선가게 골목', '떡집 모퉁이', '꽃집 계단', '장터 한가운데'] },
  { name: '언덕 동네', rule: 'arrow', levels: ['전봇대 언덕', '돌계단 길', '오래된 다리', '언덕 꼭대기'] },
  { name: '담장 골목', rule: 'door', levels: ['담장 틈새', '비밀 통로', '지붕 위 산책', '고양이 집회소'] },
  { name: '야시장', rule: 'box', levels: ['등불 거리', '야시장 입구', '짐수레 골목', '불꽃놀이 광장'] },
  { name: '강아지 공원', rule: 'wake', levels: ['공원 산책로', '낮잠 벤치', '연못가', '달빛 골목'] },
];
const RULE_ORDER = ['basic', 'order', 'arrow', 'door', 'box', 'wake'];
const ITEMS = ['빨간 우체통', '꽃 화분', '나무 벤치', '노란 가로등', '풍경', '고양이 쿠션', '물뿌리개', '파라솔', '자전거',
  '등불', '작은 분수', '달 간판', '동네 나무', '생선 가판대', '새집', '가랜드', '꽃밭', '고양이 동상',
  '벚나무', '나무 울타리', '버섯 의자', '빨랫줄', '선인장 화분', '풍선 다발'];
const LEVELS = [];
CHAPTERS.forEach((c, ci) => c.levels.forEach((name, li) => {
  const has = r => RULE_ORDER.indexOf(r) <= RULE_ORDER.indexOf(c.rule);
  const isNew = r => c.rule === r;
  LEVELS.push({ chapter: ci, li, n: (ci >= 2 ? 5 : 4) + li, name, blocks: (ci >= 2 ? 2 : 1) + li + (ci >= 3 ? 1 : 0), seed: 3000 + ci * 53 + li * 131,
    order: has('order'),
    arrows: has('arrow') ? (isNew('arrow') ? 2 + li : 1 + (li >= 2)) : 0,
    door: has('door'),
    boxes: has('box') ? (isNew('box') ? 1 + (li >= 2) : 1) : 0,
    wake: isNew('wake') ? 1 + (li >= 2) : 0,
    dog: c.rule !== 'wake' && (ci > 0 || li > 0) });
}));

function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const WAKE_CYCLE = 5, WAKE_AWAKE = 2;
const isAwake = s => s % WAKE_CYCLE < WAKE_AWAKE;

function generate(L) {
  const n = L.n, r = rng(L.seed), K = (x, y) => y * n + x;
  for (let attempt = 0; attempt < 8000; attempt++) {
    const used = new Uint8Array(n * n);
    let x = Math.floor(r() * n), y = Math.floor(r() * n);
    const path = [[x, y]]; used[K(x, y)] = 1;
    const free = (a, b) => a >= 0 && b >= 0 && a < n && b < n && !used[K(a, b)];
    const deg = ([a, b]) => DIRS.filter(([dx, dy]) => free(a + dx, b + dy)).length;
    const jumpAt = L.door ? Math.floor(n * n * (0.3 + r() * 0.2)) : -1;
    let doorIdx = -1;
    for (;;) {
      if (path.length === jumpAt && doorIdx < 0) {
        const cand = [];
        for (let b = 0; b < n; b++) for (let a = 0; a < n; a++) if (free(a, b) && Math.abs(a - x) + Math.abs(b - y) >= 3 && deg([a, b]) > 0) cand.push([a, b]);
        if (!cand.length) break;
        cand.sort((p, q) => deg(p) - deg(q) || r() - 0.5);
        const q = cand[Math.floor(r() * Math.min(3, cand.length))];
        doorIdx = path.length - 1; [x, y] = q; used[K(x, y)] = 1; path.push(q);
        continue;
      }
      const nb = DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => free(a, b));
      if (!nb.length) break;
      nb.sort((p, q) => deg(p) - deg(q) || r() - 0.5);
      const pick = r() < 0.12 ? nb[Math.floor(r() * nb.length)] : nb[0];
      [x, y] = pick; used[K(x, y)] = 1; path.push(pick);
    }
    if (L.door && (doorIdx < 1 || doorIdx > path.length - 6)) continue;
    let missing = n * n - path.length;
    if (missing > L.blocks || missing < L.blocks - 2) continue;
    while (missing < L.blocks) { path.pop(); missing++; }
    if (L.door && doorIdx + 1 >= path.length - 2) continue;

    const lv = { n, grid: [], start: path[0], goal: path[path.length - 1], solution: path, cells: path.length,
      houses: new Map(), arrows: new Map(), boxes: new Set(), wake: new Set(), doorA: -1, doorB: -1 };
    const onPath = new Set(path.map(([a, b]) => K(a, b)));
    for (let i = 0; i < n * n; i++) lv.grid.push(onPath.has(i) ? '.' : '#');
    const special = new Set([0, path.length - 1]);
    if (L.door) { lv.doorA = K(...path[doorIdx]); lv.doorB = K(...path[doorIdx + 1]); special.add(doorIdx); special.add(doorIdx + 1); }
    const dirAt = i => [path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]];
    const adjMove = i => i > 0 && i < path.length && Math.abs(dirAt(i)[0]) + Math.abs(dirAt(i)[1]) === 1;
    const hk = Math.min(2 + L.chapter, 5, Math.floor(path.length / 5));
    let num = 0;
    for (let h = 1; h <= hk; h++) {
      let i = Math.round(h * (path.length - 1) / hk);
      while (special.has(i) && i < path.length - 1 && h < hk) i++;
      if (h < hk && special.has(i)) continue;
      special.add(i); lv.houses.set(K(...path[i]), ++num);
    }
    if (!lv.houses.has(K(...lv.goal))) continue;
    const pool = () => { const a = []; for (let i = 1; i < path.length - 1; i++) if (!special.has(i)) a.push(i); return a; };
    let ok = true;
    // one-way arrows: on an arrow cell you must leave in the arrow's direction (the way the answer leaves it)
    for (let k = 0; k < L.arrows; k++) {
      const c = pool().filter(i => adjMove(i + 1) && !special.has(i + 1));
      if (!c.length) { ok = false; break; }
      const i = c[Math.floor(r() * c.length)]; special.add(i); lv.arrows.set(K(...path[i]), dirAt(i + 1));
    }
    // heavy boxes: the answer goes straight for two moves after the pickup
    for (let k = 0; k < L.boxes && ok; k++) {
      const c = pool().filter(i => i + 2 < path.length && adjMove(i) && adjMove(i + 1) && adjMove(i + 2) &&
        !special.has(i + 1) && !special.has(i + 2) && String(dirAt(i)) === String(dirAt(i + 1)) && String(dirAt(i)) === String(dirAt(i + 2)));
      if (!c.length) { ok = false; break; }
      const i = c[Math.floor(r() * c.length)]; special.add(i); special.add(i + 1); special.add(i + 2); lv.boxes.add(K(...path[i]));
    }
    // napping dogs: the answer reaches them while they sleep
    for (let k = 0; k < L.wake && ok; k++) {
      const c = pool().filter(i => !isAwake(i) && i > 3);
      if (!c.length) { ok = false; break; }
      const i = c[Math.floor(r() * c.length)]; special.add(i); lv.wake.add(K(...path[i]));
    }
    if (!ok) continue;
    const blocked = lv.grid.map((c, i) => c === '#' ? i : -1).filter(i => i >= 0);
    if (L.dog && blocked.length) lv.grid[blocked[Math.floor(r() * blocked.length)]] = 'D';
    lv.order = L.order;
    return lv;
  }
  throw new Error('level generation failed: ' + L.name);
}

// What the next move must be, if anything: an arrow under the cat, or a heavy box still being carried.
function constraint(lv, path) {
  const n = lv.n, h = path[path.length - 1], hk = h[1] * n + h[0];
  if (lv.arrows.has(hk)) return { kind: 'arrow', d: lv.arrows.get(hk), left: 1 };
  for (let j = path.length - 1; j >= Math.max(1, path.length - 2); j--) {
    const p = path[j];
    if (lv.boxes.has(p[1] * n + p[0])) {
      const prev = path[j - 1];
      return { kind: 'heavy', d: [p[0] - prev[0], p[1] - prev[1]], left: j + 2 - (path.length - 1) };
    }
  }
  return null;
}
// The rules. Returns {ok:true, teleport} or {ok:false, why}.
function tryMove(lv, path, x, y) {
  const n = lv.n, K = (a, b) => b * n + a, head = path[path.length - 1];
  const dx = x - head[0], dy = y - head[1];
  if (Math.abs(dx) + Math.abs(dy) !== 1) return { ok: false };
  if (x < 0 || y < 0 || x >= n || y >= n) return { ok: false };
  const k = K(x, y), ch = lv.grid[k];
  if (ch === '#') return { ok: false, why: 'hedge' };
  if (ch === 'D') return { ok: false, why: 'dog' };
  if (path.some(p => p[0] === x && p[1] === y)) return { ok: false, why: 'visited' };
  if (k === lv.doorB) return { ok: false, why: 'doorExit' };
  const c = constraint(lv, path);
  if (c && (c.d[0] !== dx || c.d[1] !== dy)) return { ok: false, why: c.kind };
  if (lv.wake.has(k) && isAwake(path.length)) return { ok: false, why: 'awake' };
  if (lv.order && lv.houses.has(k)) {
    const done = path.filter(p => lv.houses.has(K(p[0], p[1]))).length;
    if (lv.houses.get(k) !== done + 1) return { ok: false, why: 'order', need: done + 1 };
  }
  const add = k === lv.doorA ? 2 : 1;
  if (k === K(...lv.goal) && path.length + add < lv.cells) return { ok: false, why: 'early' };
  return { ok: true, teleport: k === lv.doorA };
}
function applyMove(lv, path, x, y) {
  const res = tryMove(lv, path, x, y);
  if (res.ok) {
    path.push([x, y]);
    if (res.teleport) { const b = lv.doorB; path.push([b % lv.n, Math.floor(b / lv.n)]); }
  }
  return res;
}
/*ENDCORE*/

// ---------- background music (generated live, no audio files) ----------
const Music = (() => {
  let ac = null, master = null, timer = null, nextT = 0, step = 0, playing = false, noiseBuf = null;
  const E = 60 / 104 / 2;
  const MEL = [
    [76, 79, 81, 79, 76, 0, 74, 72], [69, 72, 76, 74, 72, 0, 69, 0], [72, 74, 76, 77, 76, 74, 72, 0], [74, 0, 79, 0, 76, 74, 71, 0],
    [79, 76, 79, 81, 84, 0, 81, 79], [76, 0, 72, 76, 81, 79, 76, 0], [77, 76, 74, 72, 74, 76, 77, 81], [79, 0, 74, 0, 72, 0, 0, 0],
  ];
  const CH = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50], [48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(f, t, dur, type, g) {
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.value = f;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + 0.006); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function shaker(t, g) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const v = ac.createGain(); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(v); v.connect(master); s.start(t); s.stop(t + 0.06);
  }
  function kick(t) {
    const o = ac.createOscillator(), v = ac.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
    v.gain.setValueAtTime(0.22, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(v); v.connect(master); o.start(t); o.stop(t + 0.2);
  }
  function schedule() {
    while (nextT < ac.currentTime + 0.15) {
      const bar = Math.floor(step / 8) % 8, i = step % 8, m = MEL[bar][i], ch = CH[bar];
      if (m) { tone(mtof(m), nextT, 0.45, 'sine', 0.15); tone(mtof(m + 12), nextT, 0.16, 'triangle', 0.025); }
      if (i === 0 || i === 4) tone(mtof(ch[0]), nextT, 0.5, 'triangle', 0.16);
      if (i === 2 || i === 6) ch.forEach((nn, j) => tone(mtof(nn + 12), nextT + j * 0.014, 0.3, 'triangle', 0.035));
      if (i % 2 === 1) shaker(nextT, 0.03);
      if (i === 0 && bar % 2 === 0) kick(nextT);
      nextT += E; step++;
    }
  }
  function ensure() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    master.connect(lp); lp.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  return {
    start() {
      if (!ensure()) return;
      if (ac.state === 'suspended') ac.resume();
      if (playing) return;
      playing = true; nextT = ac.currentTime + 0.08; step = 0;
      master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(0, ac.currentTime); master.gain.linearRampToValueAtTime(0.55, ac.currentTime + 1.2);
      timer = setInterval(schedule, 25);
    },
    stop() { playing = false; clearInterval(timer); if (ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(0, ac.currentTime); } },
    pause() { if (ac && playing) ac.suspend(); },
    resume() { if (ac && playing) ac.resume(); },
    get playing() { return playing; },
  };
})();

// ---------- drawing helpers ----------
const ROOFS = [['#E46C55', '#C9583F'], ['#4F95DE', '#3C79C2'], ['#9A7AD8', '#7F62BE'], ['#4FB386', '#3C9A6E'], ['#F28FA5', '#D9728B'], ['#F2A93B', '#D68D24']];

function fillP(ctx, d, c) { ctx.fillStyle = c; ctx.fill(P(d)); }

function rr(ctx, x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function txt(ctx, s, x, y, size, c, font = 'Jua') { ctx.fillStyle = c; ctx.font = size + 'px ' + font + ', sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.textBaseline = 'alphabetic'; }

}
// facing right; mirror for left
function drawCatSide(ctx, legs = 0) {

  fillP(ctx, 'M34 110 Q6 106 10 76 Q12 68 19 72 Q16 96 38 100 Z', C_FUR2);
  ell(ctx, 38 - legs * 4, 128, 9, 7, C_FUR2); ell(ctx, 76 + legs * 4, 128, 9, 7, C_FUR2);
  ell(ctx, 56, 108, 32, 23, C_FUR);
  ell(ctx, 62, 117, 19, 11, C_CREAM);
  strokeP(ctx, 'M40 92 q2 8 0 14 M50 89 q2 9 0 16', '#E07E22', 4);

    const h = G.path[G.path.length - 1];
    const dx = tx - h[0], dy = ty - h[1];

    const moves = Math.abs(dx) >= Math.abs(dy) ? [[Math.sign(dx), 0], [0, Math.sign(dy)]] : [[0, Math.sign(dy)], [Math.sign(dx), 0]];

  if (here != null) { delete save.decor[here]; T.sel = +here; persist(); renderInv(); townTip(); return; }
  if (T.sel == null) { townTip(); return; }
  save.decor[T.sel] = [x, y]; T.flashK = y * TW + x; T.flashAt = performance.now();
  const placedName = ITEMS[T.sel]; T.sel = null; persist(); renderInv();
  $('townTip').textContent = placedName + ' 놓기 완료!';
});
$('townBack').onclick = showTitle;
$('homeBtn').onclick = showTitle;

function drawSign(ctx, ci, lit) {
  ell(ctx, 25, 45, 12, 3, '#2F5A2F', 0.22);
  rr(ctx, 23, 22, 4, 22, 2, '#8A5A3B');
  rr(ctx, 6, 8, 38, 20, 6, lit ? '#C8956A' : '#B7AFA6');
  rr(ctx, 6, 8, 38, 6, 4, lit ? '#DDB088' : '#C9C2BA');
  txt(ctx, String(ci + 1), 25, 19, 14, '#FFFFFF');
}
function drawTown(now) {
  const ctx = tctx, c = T.cell, s = c / 50, next = nextLevel();
  ctx.setTransform(T.dpr, 0, 0, T.dpr, 0, 0);
  ctx.clearRect(0, 0, c * TW, c * TH);
  rr(ctx, 0, 0, c * TW, c * TH, c * 0.4, '#9AD872');
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
    if (isRoad(x, y)) rr(ctx, x * c + 1, y * c + 1, c - 2, c - 2, 8 * s, '#F4DCA6');
    else if ((x * 7 + y * 3) % 5 === 0) { ell(ctx, x * c + 14 * s, y * c + 38 * s, 5 * s, 2 * s, '#7CC45A'); ell(ctx, x * c + 36 * s, y * c + 16 * s, 2 * s, 2 * s, '#FFFFFF'); }
  }
  ctx.strokeStyle = '#FFF4D6'; ctx.lineWidth = 2 * s; ctx.setLineDash([6 * s, 8 * s]);
  ROAD_ROWS.forEach(y => { ctx.beginPath(); ctx.moveTo(0, (y + .5) * c); ctx.lineTo(c * TW, (y + .5) * c); ctx.stroke(); });
  ctx.beginPath(); ctx.moveTo((ROAD_COL + .5) * c, 0); ctx.lineTo((ROAD_COL + .5) * c, c * TH); ctx.stroke(); ctx.setLineDash([]);
  if (T.edit && T.sel != null) {
    const a = 0.35 + Math.sin(now / 250) * 0.15;
    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
      if (houseAt(x, y) >= 0 || signAt(x, y) >= 0 || decorAt(x, y) != null) continue;
      ctx.globalAlpha = a; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2 * s; ctx.setLineDash([4 * s, 4 * s]);
      ctx.beginPath(); ctx.roundRect(x * c + 4 * s, y * c + 4 * s, c - 8 * s, c - 8 * s, 8 * s); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }
  for (let y = 0; y < TH; y++) {
    for (let x = 0; x < TW; x++) {
      const hs = houseAt(x, y), sg = signAt(x, y);
      if (sg >= 0) { ctx.save(); ctx.translate(x * c, y * c); ctx.scale(s, s); drawSign(ctx, sg, unlocked(sg * 4)); ctx.restore(); continue; }
      if (hs < 0) continue;
      ctx.save(); ctx.translate(x * c, y * c); ctx.scale(s, s);
      const cleared = save.stars[hs] > 0, open = unlocked(hs);
      if (cleared) {
        ell(ctx, 25, 30, 24, 20, '#FFF1B0', 0.35 + Math.sin(now / 700 + hs) * 0.08);
        drawHouse(ctx, ROOFS[LEVELS[hs].chapter % ROOFS.length], false, 0, 'none'); rr(ctx, 32, 27, 6, 6, 1.5, '#FFD98A');
        txt(ctx, '★'.repeat(save.stars[hs]), 25, 48, 7, '#E9A50E');
      } else if (open) {
        drawHouse(ctx, ROOFS[LEVELS[hs].chapter % ROOFS.length], false, 0, 'none');
        if (hs === next) {
          const b = Math.abs(Math.sin(now / 320)) * 4;
          ctx.save(); ctx.translate(30, -2 - b); ctx.scale(0.75, 0.75); drawFlag(ctx, now); ctx.restore();
        }
      } else {
        ctx.save(); ctx.globalAlpha = 0.5; ctx.filter = 'grayscale(1)'; drawHouse(ctx, ['#9AA7B5', '#8796A6'], false, 0, 'none'); ctx.restore();
        drawLock(ctx);
      }
      if (open) { rr(ctx, 13, 38, 24, 10, 5, 'rgba(255,255,255,0.85)'); txt(ctx, (LEVELS[hs].chapter + 1) + '-' + (LEVELS[hs].li + 1), 25, 43.5, 8, '#1E3A57'); }
      ctx.restore();
    }
    Object.entries(save.decor).filter(([, p]) => p[1] === y).forEach(([id, p]) => {
      const pop = T.flashK === p[1] * TW + p[0] ? Math.max(0, 1 - (now - T.flashAt) / 350) : 0;
      ctx.save(); ctx.translate(p[0] * c + c / 2, p[1] * c + c); ctx.scale(s * (1 + pop * 0.25), s * (1 - pop * 0.15)); ctx.translate(-25, -50);
      drawItem(ctx, +id); ctx.restore();
    });
  }
}

// ---------- board render ----------
function resize() {
  const wrap = $('boardWrap').getBoundingClientRect(), n = G.lv.n;
  cell = Math.floor(Math.min((wrap.width - 12) / n, (wrap.height - 30) / n, 72));
  cell = Math.max(cell, 28);
  dpr = window.devicePixelRatio || 1;
  board.style.width = cell * n + 'px'; board.style.height = cell * n + 'px';
  board.width = Math.round(cell * n * dpr); board.height = Math.round(cell * n * dpr);
}
window.addEventListener('resize', () => { if (G && !$('play').hidden) resize(); });

function center(p) { return [(p[0] + 0.5) * cell, (p[1] + 0.5) * cell]; }
function strokePath(ctx, pts, w, c, a = 1, dash) {
  if (pts.length < 2) return;
  ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash(dash || []); ctx.beginPath();
  pts.forEach((p, k) => {
    const [x, y] = center(p);
    const jump = k > 0 && Math.abs(p[0] - pts[k - 1][0]) + Math.abs(p[1] - pts[k - 1][1]) !== 1;
    (k === 0 || jump) ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!$('town').hidden) { drawTown(now); return; }
  if (!G || $('play').hidden) return;
  const ctx = bctx, s = cell / 50, lv = G.lv, n = lv.n, goalK = kOf(lv.goal[0], lv.goal[1]);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cell * n, cell * n);
  rr(ctx, 0, 0, cell * n, cell * n, cell * 0.5, '#A6DD7E');
  const con = constraint(lv, G.path);
  const head = G.path[G.path.length - 1];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const ch = at(x, y), k = kOf(x, y);
    if (ch === '#' || ch === 'D') continue;
    const vis = G.visited.has(k);
    if (k === goalK && !vis) {
      const pulse = (now / 1100) % 1;
      rr(ctx, x * cell + 3 * s, y * cell + 3 * s, 44 * s, 44 * s, 12 * s, '#FFE28A');
      ctx.globalAlpha = 1 - pulse; ctx.strokeStyle = '#FFB020'; ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.roundRect(x * cell + (3 - pulse * 3) * s, y * cell + (3 - pulse * 3) * s, (44 + pulse * 6) * s, (44 + pulse * 6) * s, 14 * s); ctx.stroke(); ctx.globalAlpha = 1;
      continue;
    }
    let tone = vis ? ((x + y) % 2 ? '#FFCF94' : '#FFD9A6') : ((x + y) % 2 ? '#F4DCA6' : '#F8E4B5');
    if (k === lv.doorA || k === lv.doorB) tone = vis ? '#E4D9FF' : '#DCD0FF';
    rr(ctx, x * cell + 3 * s, y * cell + 3 * s, 44 * s, 44 * s, 12 * s, tone);
    if (!vis && !lv.arrows.has(k) && (x * 3 + y * 5) % 4 === 0) ell(ctx, x * cell + 18 * s, y * cell + 14 * s, 9 * s, 4 * s, '#FCF0D2');
  }
  // the lane the cat is forced into (arrow under it, or heavy box)
  if (con) {
    for (let t = 1; t <= con.left; t++) {
      const fx = head[0] + con.d[0] * t, fy = head[1] + con.d[1] * t;
      if (!inB(fx, fy)) break;
      ctx.save(); ctx.translate(fx * cell, fy * cell); ctx.scale(s, s); ctx.globalAlpha = 0.55 + Math.sin(now / 200) * 0.2; drawArrow(ctx, con.d, false, '#38B07A'); ctx.restore();
    }
  }
  if (G.ghost && now < G.ghostUntil) {
    const a = Math.min(1, (G.ghostUntil - now) / 600);
    strokePath(ctx, G.ghost, 7 * s, '#2B5FA8', 0.6 * a, [2 * s, 10 * s]);
  }
  ctx.save(); ctx.filter = 'blur(' + (4 * s) + 'px)'; strokePath(ctx, G.path, 22 * s, '#FFB24D', 0.5); ctx.restore();
  strokePath(ctx, G.path, 12 * s, '#FF9A3A');
  strokePath(ctx, G.path, 3 * s, '#FFE0AE', 1, [2 * s, 14 * s]);
  const barkT = G.barkAt ? 1 - (now - G.barkAt) / 1200 : 0;
  const wi = wakeInfo();
  let hi = 0;
  const catRow = Math.round(G.cat.y);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const ch = at(x, y), k = kOf(x, y), vis = G.visited.has(k);
      ctx.save(); ctx.translate(x * cell, y * cell); ctx.scale(s, s);
      if (ch === '#') drawHedge(ctx);
      else if (ch === 'D') drawDog(ctx, barkT > 0, barkT);
      else {
        if (lv.arrows.has(k)) drawArrow(ctx, lv.arrows.get(k), vis);
        if (k === lv.doorA) drawDoor(ctx, false, vis, now);
        if (k === lv.doorB) drawDoor(ctx, true, vis, now);
        if (lv.boxes.has(k) && !vis) drawBox(ctx, Math.sin(now / 400 + k) * 1.2);
        if (lv.wake.has(k)) {
          const bub = G.wakeBarkK === k ? 1 - (now - G.wakeBarkAt) / 1200 : 0;
          ctx.save(); if (vis) ctx.globalAlpha = 0.55; drawDog(ctx, !vis && wi.awake, bub); ctx.restore();
          if (!vis) drawCounter(ctx, wi.k, wi.awake);
        }
        if (lv.houses.has(k)) {
          const b0 = G.bounce[k], t = b0 ? (now - b0) / 400 : 1, isGoal = k === goalK;
          const badge = isGoal ? 'none' : lv.order ? lv.houses.get(k) : 'parcel';
          drawHouse(ctx, isGoal ? ['#FFC531', '#E9A50E'] : ROOFS[hi++ % ROOFS.length], vis, t < 1 ? Math.sin(t * Math.PI) : 0, badge);
          if (isGoal && !vis) {
            if (lv.order) { ell(ctx, 41, 39, 7, 7, '#2B5FA8'); txt(ctx, String(lv.houses.get(k)), 41, 40, 10, '#FFFFFF'); }
            ctx.translate(21, 3); ctx.scale(1.08, 1.08); drawFlag(ctx, now);
          }
        }
      }
      ctx.restore();
    }
    if (y === catRow) drawCatOnBoard(ctx, now, s, con);
  }
  const dt = (now - G.ddaengAt) / 900;
  if (dt >= 0 && dt < 1) {
    const sh = Math.sin(dt * 40) * 4 * (1 - dt);
    ctx.globalAlpha = 1 - dt * dt;
    ctx.font = Math.round(Math.min(cell * 0.9, 56)) + 'px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6 * s; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText('땡!', cell * n / 2 + sh, cell * n / 2);
    ctx.fillStyle = '#E5533F'; ctx.fillText('땡!', cell * n / 2 + sh, cell * n / 2);
    ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
  const pt = (now - G.poofAt) / 500;
  if (pt >= 0 && pt < 1) {
    const [cx, cy] = center(head);
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ell(ctx, cx + Math.cos(a) * pt * 26 * s, cy + Math.sin(a) * pt * 26 * s, 3 * s * (1 - pt), 3 * s * (1 - pt), '#B9A6FF'); }
  }
  if (G.path.length === 1 && !G.done) {
    const pulse = (now / 1000) % 1;
    ctx.globalAlpha = 1 - pulse; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.arc((head[0] + .5) * cell, (head[1] + .5) * cell, (20 + pulse * 10) * s, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawCatOnBoard(ctx, now, s, con) {
  const head = G.path[G.path.length - 1];
  const ddx = head[0] - G.cat.x, ddy = head[1] - G.cat.y;
  G.cat.x += ddx * 0.3; G.cat.y += ddy * 0.3;
  const moving = Math.abs(ddx) + Math.abs(ddy) > 0.03;
  const legs = moving ? Math.sin(now / 70) : 0;
  const hop = moving ? Math.abs(Math.sin(now / 70)) * 2.5 : G.done ? Math.abs(Math.sin(now / 160)) * 5 : 0;
  const sc = cell * 0.9 / 140;
  ctx.save();
  const footY = Math.max(140 * sc + 1, (G.cat.y + 1) * cell - 2 * s - hop * s);
  ctx.translate((G.cat.x + 0.5) * cell, footY);
  ctx.scale(sc, sc); ctx.translate(-60, -140);
  drawCat(ctx, G.done ? 'down' : G.dir, legs, G.done);
  if (con && con.kind === 'heavy') {
    const bx = G.dir === 'left' ? 4 : G.dir === 'right' ? 70 : 38;
    ctx.translate(bx, 78); rr(ctx, 0, 0, 44, 34, 7, '#C98E55'); rr(ctx, 0, 0, 44, 11, 5, '#DDA86F'); rr(ctx, 19, 0, 6, 34, 0, '#F2D29E');
  }
  ctx.restore();
}
requestAnimationFrame(frame);
syncMusicButtons();
showTitle();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
