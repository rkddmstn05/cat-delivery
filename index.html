<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0;font-size:14px;-webkit-text-size-adjust:100%;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-shaped column over a painted sky-and-grass backdrop; screens swap in place. Single committed daylight look. */
:root{
  --sky:#6EC1F2; --sky-pale:#CDEEFF; --grass:#93D46A; --grass-deep:#6FB84E;
  --ink:#1E3A57; --ink-soft:#3F5870; --orange:#E5671F; --orange-deep:#B44E14;
  --cream:#FFF6E3; --cream-deep:#F0CF95; --blue:#2B5FA8; --card:#FFFFFF; --card-soft:#EEF7FD;
  --gold:#FFC531; --gold-deep:#F2A91C; --hint:#FFC94A; --hint-deep:#D99A1E; --hint-ink:#5E3A00;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 20px;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button{font-family:var(--display);border:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:active{transform:translateY(3px)}
button:disabled{opacity:.45;cursor:default;transform:none}
.btn-main{height:62px;border-radius:22px;background:var(--orange);color:#FFFFFF;font-size:26px;box-shadow:0 6px 0 var(--orange-deep),0 12px 20px rgba(120,60,20,.2)}
.btn-sub{height:52px;border-radius:22px;background:var(--card);color:var(--blue);font-size:20px;box-shadow:0 5px 0 #C6DCEB}
.round{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(60,120,170,.2);flex:none}
.pill{background:rgba(255,255,255,.88);border-radius:999px;display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:15px;box-shadow:0 3px 0 rgba(60,120,170,.15)}

/* title */
#title{align-items:center;gap:18px}
.toprow{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{margin-top:12px;padding:18px 30px 22px;border-radius:34px;background:var(--cream);box-shadow:0 6px 0 var(--cream-deep),0 16px 30px rgba(40,100,160,.18);text-align:center}
.logo small{display:block;font-family:var(--display);font-size:18px;color:var(--blue)}
.logo h1{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,52px);line-height:1.05;color:#C9561A;text-wrap:balance}
#titleCat{width:min(140px,36vw);height:auto;flex:none}
.levels{width:100%;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.chapter{display:grid;grid-template-columns:76px repeat(3,1fr);gap:8px;align-items:center}
.ch-label{display:flex;flex-direction:column;line-height:1.2}
.ch-label b{font-family:var(--display);font-weight:400;font-size:16px}
.ch-label span{font-size:12px;color:var(--ink-soft)}
.lv{height:52px;max-width:100%;border-radius:18px;background:var(--card);box-shadow:0 4px 0 #C6DCEB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;color:var(--ink)}
.lv .st{font-size:11px;letter-spacing:1px;color:var(--gold-deep);font-family:var(--body)}
.lv.locked{background:rgba(255,255,255,.55);color:var(--ink-soft)}
.title-actions{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:12px}

/* play */
#play{gap:12px}
.hud{display:flex;align-items:center;gap:10px}
.hud .name{flex:1;min-width:0;display:flex;flex-direction:column}
.hud .name span:first-child{font-size:13px;color:var(--ink)}
.hud .name b{font-family:var(--display);font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:1px}
.bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.88);border-radius:18px;padding:8px 16px;box-shadow:0 4px 0 rgba(60,120,170,.15)}
.bar b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{touch-action:none;display:block;max-width:100%}
#tip{margin:0;text-align:center;font-size:14px;line-height:1.5;color:#1F4A2A;background:rgba(255,255,255,.72);border-radius:14px;padding:8px 12px;min-height:42px;display:flex;align-items:center;justify-content:center}
.controls{display:flex;gap:10px}
.controls button{flex:1;height:54px;border-radius:20px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:6px}
.c-undo{background:var(--card);color:var(--blue);box-shadow:0 5px 0 #B9D7A0}
.c-hint{background:var(--hint);color:var(--hint-ink);box-shadow:0 5px 0 var(--hint-deep)}

/* clear */
#clear{position:fixed;inset:0;z-index:5;background:rgba(30,90,150,.45);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:330px;background:var(--card);border-radius:30px;box-shadow:0 8px 0 #BFE2F5,0 20px 40px rgba(20,80,140,.25);padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}
.card .bigstars{display:flex;align-items:flex-end;gap:4px;margin-top:-64px}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:40px;color:#C9561A}
.card p{margin:0;font-size:15px;color:var(--ink-soft);text-align:center}
.reward{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--card-soft);border-radius:18px;padding:10px 14px}
.reward span{flex:1}
.reward b{font-family:var(--display);font-weight:400;font-size:21px;color:#24507A}
.card .acts{width:100%;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<script>
/*CORE*/
// Chapters grow the board: 5x5 -> 6x6 -> 7x7 -> 8x8. Each level is generated from a fixed seed,
// so the same level always looks the same. A level is built by walking a path first, so it is always solvable.
const CHAPTERS = [
  { n: 5, name: '아랫마을', blocks: [2, 2, 3], levels: ['첫 배달', '우유가게 앞', '빨래터 길'] },
  { n: 6, name: '시장 골목', blocks: [3, 3, 4], levels: ['생선가게 골목', '떡집 모퉁이', '꽃집 계단'] },
  { n: 7, name: '언덕 동네', blocks: [4, 4, 5], levels: ['전봇대 언덕', '꽃밭 미로', '오래된 다리'] },
  { n: 8, name: '야시장', blocks: [5, 6, 6], levels: ['등불 거리', '야시장 입구', '달빛 골목'] },
];
const ITEMS = ['빨간 우체통', '꽃 화분', '나무 벤치', '노란 가로등', '풍경', '고양이 쿠션', '물뿌리개', '파라솔', '자전거', '등불', '작은 분수', '달 모양 간판'];
const LEVELS = [];
CHAPTERS.forEach((c, ci) => c.levels.forEach((name, li) => LEVELS.push({ chapter: ci, n: c.n, name, blocks: c.blocks[li], seed: 1000 + ci * 37 + li * 101, dog: ci > 0 || li > 0 })));

function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function generate(L) {
  const n = L.n, r = rng(L.seed);
  for (let attempt = 0; attempt < 2000; attempt++) {
    const used = new Uint8Array(n * n);
    let x = Math.floor(r() * n), y = Math.floor(r() * n);
    const path = [[x, y]]; used[y * n + x] = 1;
    const free = (a, b) => a >= 0 && b >= 0 && a < n && b < n && !used[b * n + a];
    for (;;) {
      const nb = DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => free(a, b));
      if (!nb.length) break;
      const deg = ([a, b]) => DIRS.filter(([dx, dy]) => free(a + dx, b + dy)).length;
      nb.sort((p, q) => deg(p) - deg(q) || r() - 0.5);
      const pick = r() < 0.12 ? nb[Math.floor(r() * nb.length)] : nb[0];
      [x, y] = pick; used[y * n + x] = 1; path.push(pick);
    }
    let missing = n * n - path.length;
    if (missing > L.blocks || missing < L.blocks - 2) continue;
    while (missing < L.blocks) { path.pop(); missing++; }
    const onPath = new Set(path.map(([a, b]) => b * n + a));
    const grid = [];
    for (let i = 0; i < n * n; i++) grid.push(onPath.has(i) ? '.' : '#');
    grid[path[0][1] * n + path[0][0]] = 'C';
    const blocked = grid.map((c, i) => c === '#' ? i : -1).filter(i => i >= 0);
    if (L.dog && blocked.length) grid[blocked[Math.floor(r() * blocked.length)]] = 'D';
    const k = Math.min(2 + L.chapter, 5);
    for (let h = 1; h <= k; h++) {
      const p = path[Math.round(h * (path.length - 1) / k)];
      grid[p[1] * n + p[0]] = 'H';
    }
    const goal = path[path.length - 1];
    return { n, grid, start: path[0], goal, solution: path, cells: path.length };
  }
  throw new Error('level generation failed: ' + L.name);
}
/*ENDCORE*/

// ---------- drawing ----------
const ROOFS = [['#E46C55', '#C9583F'], ['#4F95DE', '#3C79C2'], ['#F2A93B', '#D68D24'], ['#9A7AD8', '#7F62BE']];
const P = s => new Path2D(s);
function fillP(ctx, d, c) { ctx.fillStyle = c; ctx.fill(P(d)); }
function ell(ctx, cx, cy, rx, ry, c, a = 1, rot = 0) { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
function rr(ctx, x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function drawCatHead(ctx, happy) {
  ell(ctx, 20, 42, 14, 3.5, '#1E4A6E', 0.2);
  fillP(ctx, 'M5 18 Q4 2 10 2 Q14 3 20 10 Z', '#F7A845');
  fillP(ctx, 'M35 18 Q36 2 30 2 Q26 3 20 10 Z', '#F7A845');
  ell(ctx, 20, 24, 17, 15, '#F7A845');
  fillP(ctx, 'M4 26 Q20 44 36 26 Q34 37 20 38 Q6 37 4 26 Z', '#EA902F');
  fillP(ctx, 'M6 15 Q8 3 20 3 Q32 3 34 15 Q20 11 6 15 Z', '#3C7DD9');
  ell(ctx, 15, 7, 5, 1.8, '#78AEF0');
  ell(ctx, 20, 29, 7, 5, '#FFF4E4');
  if (happy) {
    ctx.strokeStyle = '#2A2F3A'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.stroke(P('M10.5 24.5 q2.5 -3 5 0 M24.5 24.5 q2.5 -3 5 0'));
  } else {
    ell(ctx, 13, 24, 2.3, 3, '#2A2F3A'); ell(ctx, 27, 24, 2.3, 3, '#2A2F3A');
    ell(ctx, 14, 22.6, 0.9, 0.9, '#FFFFFF'); ell(ctx, 28, 22.6, 0.9, 0.9, '#FFFFFF');
  }
  fillP(ctx, 'M18.4 27 h3.2 l-1.6 1.8 z', '#F07A8A');
  ell(ctx, 8, 30, 3, 1.8, '#FF7E7E', 0.5); ell(ctx, 32, 30, 3, 1.8, '#FF7E7E', 0.5);
}
function drawCatBody(ctx) {
  ell(ctx, 60, 134, 34, 6, '#1E4A6E', 0.18);
  fillP(ctx, 'M90 110 Q118 102 112 74 Q109 66 102 71 Q107 92 86 100 Z', '#EE9533');
  ell(ctx, 60, 108, 30, 26, '#F7A845'); ell(ctx, 60, 115, 17, 15, '#FFF4E4');
  ctx.strokeStyle = '#8A5A3B'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke(P('M36 90 L86 118'));
  rr(ctx, 74, 106, 28, 22, 7, '#9C6A45'); rr(ctx, 74, 106, 28, 10, 5, '#BC8559');
  ell(ctx, 44, 131, 10, 6, '#F29C3A'); ell(ctx, 76, 131, 10, 6, '#F29C3A'); ell(ctx, 33, 104, 8, 11, '#EE9533');
  fillP(ctx, 'M22 42 Q20 10 30 8 Q38 8 54 28 Z', '#F7A845'); fillP(ctx, 'M29 35 Q29 19 33 17 Q38 19 46 28 Z', '#FFB9A8');
  fillP(ctx, 'M98 42 Q100 10 90 8 Q82 8 66 28 Z', '#F7A845'); fillP(ctx, 'M91 35 Q91 19 87 17 Q82 19 74 28 Z', '#FFB9A8');

// ---------- state ----------
let save = { stars: LEVELS.map(() => 0), coins: 0 };
try { const s = JSON.parse(localStorage.getItem('catDelivery2') || 'null'); if (s && Array.isArray(s.stars)) save = { stars: LEVELS.map((_, i) => s.stars[i] || 0), coins: s.coins || 0 }; } catch (e) {}
function persist() { try { localStorage.setItem('catDelivery2', JSON.stringify(save)); } catch (e) {} }

let G = null;
const $ = id => document.getElementById(id);
const board = $('board'), bctx = board.getContext('2d');
let cell = 50, dpr = 1;
const at = (x, y) => G.lv.grid[y * G.lv.n + x];
const inB = (x, y) => x >= 0 && y >= 0 && x < G.lv.n && y < G.lv.n;
const passable = (x, y) => inB(x, y) && at(x, y) !== '#' && at(x, y) !== 'D';

function startLevel(i) {
  const lv = generate(LEVELS[i]);
  G = { i, lv, path: [lv.start], visited: new Set([lv.start[1] * lv.n + lv.start[0]]), hintUsed: false, ghost: null, ghostUntil: 0,
        bounce: {}, barkAt: 0, ddaengAt: -9999, cat: { x: lv.start[0], y: lv.start[1] }, drawing: false, done: false };
  const L = LEVELS[i], c = CHAPTERS[L.chapter];
  $('lvNo').textContent = c.name + ' · ' + c.n + '×' + c.n + ' · ' + (L.chapter + 1) + '-' + (c.levels.indexOf(L.name) + 1);
  $('lvName').textContent = L.name;
  setTip(i === 0 ? '모든 칸을 한 번씩 지나서 깃발이 꽂힌 마지막 집에 도착해요' : L.dog && i === 1 ? '강아지가 자는 칸과 덤불만 빼고 모든 칸을 지나가요' : '모든 칸을 채우고 깃발 집에 마지막으로 도착하면 성공!');
  $('title').hidden = true; $('play').hidden = false; $('clear').hidden = true;

}
function setTip(t) { $('tip').textContent = t; }
function currentStars() { return G.hintUsed ? 2 : 3; }
const STAR = (sz, on) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="${on ? '#FFC531' : '#D7E3EC'}"/>${on ? '<path d="M12 17.6L5.8 21.1l1.4-7L2 9.3 12 12z" fill="#F2A91C"/><ellipse cx="10.5" cy="8.5" rx="2" ry="1.2" fill="#FFF0B0"/>' : ''}</svg>`;
function updateHud() {

  $('hudStars').setAttribute('aria-label', '별 3개 중 ' + s + '개');
  $('left').textContent = (G.lv.cells - G.path.length) + ' / ' + G.lv.cells;
  $('undoBtn').disabled = G.path.length < 2 || G.done;

}
function rebuildVisited() { G.visited = new Set(G.path.map(([x, y]) => y * G.lv.n + x)); }
function step(x, y) {

    $('bigStars').innerHTML = STAR(56, s >= 1) + STAR(78, s >= 2) + STAR(56, s >= 3);
    $('bigStars').setAttribute('aria-label', '별 ' + s + '개');
    $('clearMsg').textContent = s === 3 ? '모든 칸을 지나 마지막 집까지 배달했어요' : '힌트를 보고 모든 칸을 지났어요';
    $('rCoins').textContent = '+' + coins;
    $('rItem').textContent = first ? ITEMS[G.i] : '이미 받음';

// ---------- input ----------
function cellFromEvent(e) {

}
board.addEventListener('pointerdown', e => {

  updateHud();
};
$('backBtn').onclick = showTitle;
$('nextBtn').onclick = () => { if (G.i < LEVELS.length - 1) startLevel(G.i + 1); else showTitle(); };
$('retryBtn').onclick = () => startLevel(G.i);
$('startBtn').onclick = () => { const n = save.stars.findIndex(s => s === 0); startLevel(n < 0 ? 0 : n); };

function showTitle() {
  $('clear').hidden = true; $('play').hidden = true; $('title').hidden = false;
  $('coins').textContent = save.coins.toLocaleString('ko-KR');
  $('starTotal').textContent = save.stars.reduce((a, b) => a + b, 0);
  const box = $('levels'); box.innerHTML = '';
  CHAPTERS.forEach((c, ci) => {
    const row = document.createElement('div'); row.className = 'chapter';
    const label = document.createElement('div'); label.className = 'ch-label';
    label.innerHTML = '<b>' + c.name + '</b><span>' + c.n + '×' + c.n + '</span>';
    row.appendChild(label);
    LEVELS.forEach((L, i) => {
      if (L.chapter !== ci) return;
      const unlocked = i === 0 || save.stars[i - 1] > 0;
      const b = document.createElement('button');
      b.className = 'lv' + (unlocked ? '' : ' locked');
      b.disabled = !unlocked;
      const no = (ci + 1) + '-' + (c.levels.indexOf(L.name) + 1);
      b.setAttribute('aria-label', no + ' ' + L.name + (unlocked ? ', 별 ' + save.stars[i] + '개' : ', 잠김'));
      b.innerHTML = '<span>' + no + '</span><span class="st">' + (unlocked ? '★'.repeat(save.stars[i]) + '☆'.repeat(3 - save.stars[i]) : '잠김') + '</span>';

    });

  });

function drawTitleCat() {
  const c = $('titleCat'), x = c.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height);
  x.setTransform(3.2, 0, 0, 3.2, 8, 0); drawCatBody(x);
}

// ---------- render ----------
function resize() {
  const wrap = $('boardWrap').getBoundingClientRect(), n = G.lv.n;
  cell = Math.floor(Math.min((wrap.width - 12) / n, (wrap.height - 24) / n, 72));
  cell = Math.max(cell, 28);
  dpr = window.devicePixelRatio || 1;
  board.style.width = cell * n + 'px'; board.style.height = cell * n + 'px';
  board.width = Math.round(cell * n * dpr); board.height = Math.round(cell * n * dpr);
}
window.addEventListener('resize', () => { if (G && !$('play').hidden) resize(); });

function center(p) { return [(p[0] + 0.5) * cell, (p[1] + 0.5) * cell]; }
function strokePath(ctx, pts, w, c, a = 1, dash) {
  if (pts.length < 2) return;
  ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash(dash || []); ctx.beginPath();

function frame(now) {

    const goalCell = x === G.lv.goal[0] && y === G.lv.goal[1];

  const barkT = G.barkAt ? 1 - (now - G.barkAt) / 1200 : 0;

    const ch = at(x, y);

    else if (ch === 'H') {
      const k = y * n + x, b0 = G.bounce[k], t = b0 ? (now - b0) / 400 : 1;
      const isGoal = x === G.lv.goal[0] && y === G.lv.goal[1];
      drawHouse(ctx, isGoal ? ['#FFC531', '#E9A50E'] : ROOFS[hi++ % ROOFS.length], G.visited.has(k), t < 1 ? Math.sin(t * Math.PI) : 0, isGoal);
      if (isGoal && !G.visited.has(k)) { ctx.translate(21, 3); ctx.scale(1.08, 1.08); drawFlag(ctx, now); }

    ctx.lineWidth = 6 * s; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText('땡!', cell * n / 2 + sh, cell * n / 2);

  const hop = G.drawing ? Math.abs(Math.sin(now / 90)) * 2 : 0;
  ctx.save(); ctx.translate(G.cat.x * cell + 5 * s, G.cat.y * cell + 1 * s - hop * s); ctx.scale(s, s);
  drawCatHead(ctx, G.done); ctx.restore();
  if (G.path.length === 1 && !G.done) {
    const pulse = (now / 1000) % 1;

}
requestAnimationFrame(frame);
document.fonts && document.fonts.ready.then(() => { if (!$('title').hidden) drawTitleCat(); });
showTitle();
